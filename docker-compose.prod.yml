version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    expose:
      - "8000"
    environment:
      - SECRET_KEY=${SECRET_KEY:-production-cyber-shield-key-2026}
      - DATABASE_URL=sqlite:////app/cybershield.db
      - VT_API_KEY=${VT_API_KEY:-}
      - GSB_API_KEY=${GSB_API_KEY:-}
    volumes:
      - ./cybershield_prod.db:/app/cybershield.db
    restart: unless-stopped

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    expose:
      - "3005"
    environment:
      # In production, Next.js needs to know the public URL to talk to the backend
      - NEXT_PUBLIC_API_URL=https://${DOMAIN:-cybershield.local}/api/v1
    depends_on:
      - backend
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d
      - ./nginx/ssl:/etc/nginx/ssl
    depends_on:
      - web
      - backend
    restart: always
